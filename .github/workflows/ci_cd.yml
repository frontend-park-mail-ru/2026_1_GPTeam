on:
  push:
    branches:
      - "main"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: "22"
          script: |
            cd ~/front/
            git pull
            npm i
            rm -rf dist/
            npm run build
            cd ../
            cp front/docker-compose.yaml docker-compose.yaml
            cp front/nginx.conf nginx/nginx.conf
            docker compose down
            docker compose up -d
            sleep 10
            docker compose ps
