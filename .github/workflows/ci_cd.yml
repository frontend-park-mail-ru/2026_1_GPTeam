on:
  push:
    branches:
      - "main"
      - "dev"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

      - name: Upload support artifact
        uses: actions/upload-artifact@v4
        with:
          name: support
          path: support/
          retention-days: 1

      - name: Upload nginx artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx
          path: nginx.conf
          retention-days: 1

      - name: Upload docker artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker
          path: docker-compose.yaml
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Clean old files on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: "22"
          script: |
            rm -rf ~/front/dist/
            rm -rf ~/front/support/

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Copy dist to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: "22"
          source: "dist/"
          target: "~/front/"

      - name: Download support artifact
        uses: actions/download-artifact@v4
        with:
          name: support
          path: support

      - name: Copy support to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: "22"
          source: "support/"
          target: "~/front/"

      - name: Download nginx.conf artifact
        uses: actions/download-artifact@v4
        with:
          name: nginx
          path: nginx

      - name: Copy nginx to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: "22"
          source: "nginx/*"
          target: "~/nginx"

      - name: Download docker artifact
        uses: actions/download-artifact@v4
        with:
          name: docker
          path: docker

      - name: Copy docker to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: "22"
          source: "docker/*"
          target: "~"

      - name: Restart docker
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: "22"
          script: |
            cd ~
            docker compose down
            docker compose up -d
            sleep 5
            docker compose ps
